name: tidaline-case-study

# ---------------- Airflow Configs ----------------
x-airflow-common:
  &airflow-common
  image: apache/airflow:3.3.0
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
  networks:
    - case-study-network

# ---------------- Hadoop node template (used by HDFS/YARN daemons) ----------------
x-hadoop-common:
  &hadoop-common
  env_file: ./hadoop.env
  networks:
    - case-study-network

services:
  # ---------------- Existing services ----------------
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:29093,INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka_kraft_data:/var/lib/kafka/data
    networks:
      - case-study-network

  postgres:
    image: postgres:15
    container_name: postgres
    hostname: postgres
    ports:
      - "7432:5432"
    environment:
      POSTGRES_DB: maritime_logistics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maritime_logistics -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./stream/create_earthquakes.sql:/docker-entrypoint-initdb.d/01-earthquakes.sql:ro
    restart: unless-stopped
    networks:
      - case-study-network

  stream_extractor:
    build:
      context: ./stream
      dockerfile: Dockerfile
    container_name: stream_extractor
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: maritime_logistics
      DB_USER: postgres
      DB_PASSWORD: postgres
      RETRY_SECONDS: 10
      LOG_LEVEL: INFO
    restart: unless-stopped
    networks:
      - case-study-network

  kafka-connect:
    image: debezium/connect:2.5
    container_name: kafka-connect
    hostname: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: case-study-connect
      CONFIG_STORAGE_TOPIC: case-study-connect-configs
      OFFSET_STORAGE_TOPIC: case-study-connect-offsets
      STATUS_STORAGE_TOPIC: case-study-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8083/connector-plugins >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    networks:
      - case-study-network

  debezium-setup:
    image: curlimages/curl:latest
    container_name: debezium-setup
    depends_on:
      kafka-connect:
        condition: service_healthy
    networks:
      - case-study-network
    command:
      - "-c"
      - |
        echo "Waiting for Kafka Connect to be ready..."
        sleep 5
        echo "Sending Debezium configuration..."
        curl -i -X POST -H "Accept:application/json" -H "Content-Type:application/json" kafka-connect:8083/connectors/ -d '{
          "name": "earthquakes-connector",
          "config": {
            "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
            "database.hostname": "postgres",
            "database.port": "5432",
            "database.user": "postgres",
            "database.password": "postgres",
            "database.dbname": "maritime_logistics",
            "topic.prefix": "maritime_server",
            "table.include.list": "public.earthquakes",
            "plugin.name": "pgoutput"
          }
        }'
        echo "Debezium configuration sent!"
    entrypoint: [ "/bin/sh" ]

  sftp:
    image: atmoz/sftp:debian
    container_name: sftp
    hostname: sftp
    ports:
      - "2222:22"
    command: batch:batchpass:1001:1001:data
    volumes:
      - ./batch/data:/data
      - ./batch/data:/home/batch/data
    restart: unless-stopped
    networks:
      - case-study-network

  batch-generator:
    build:
      context: ./batch
      dockerfile: Dockerfile
    container_name: batch-generator
    volumes:
      - ./batch/data:/app/data
    environment:
      VESSEL_REQUEST_DELAY: "2"
    networks:
      - case-study-network

  # ---------------- Airflow ----------------
  airflow-db:
    image: postgres:15
    container_name: airflow-db
    hostname: airflow-db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - case-study-network

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email airflow@example.com
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor
    restart: unless-stopped

  airflow-api-server:
    <<: *airflow-common
    container_name: airflow-api-server
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "9000:8080"
    command: api-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------------- Coordination: 3-node ZooKeeper ensemble ----------------
  zoo1:
    image: zookeeper:3.8
    container_name: zoo1
    hostname: zoo1
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - case-study-network

  zoo2:
    image: zookeeper:3.8
    container_name: zoo2
    hostname: zoo2
    environment:
      ZOO_MY_ID: 2
      ZOO_SERVERS: server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - case-study-network

  zoo3:
    image: zookeeper:3.8
    container_name: zoo3
    hostname: zoo3
    environment:
      ZOO_MY_ID: 3
      ZOO_SERVERS: server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - case-study-network

  # ---------------- Hadoop HA — HDFS ----------------
  journalnode1:
    <<: *hadoop-common
    build:
      context: ./journalnode
      dockerfile: Dockerfile
    container_name: journalnode01
    hostname: journalnode01
    volumes:
      - hadoop_journal1:/hadoop/dfs/journalnode

  journalnode2:
    <<: *hadoop-common
    build:
      context: ./journalnode
      dockerfile: Dockerfile
    container_name: journalnode02
    hostname: journalnode02
    volumes:
      - hadoop_journal2:/hadoop/dfs/journalnode

  journalnode3:
    <<: *hadoop-common
    build:
      context: ./journalnode
      dockerfile: Dockerfile
    container_name: journalnode03
    hostname: journalnode03
    volumes:
      - hadoop_journal3:/hadoop/dfs/journalnode

  namenode1:
    <<: *hadoop-common
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode1
    hostname: namenode1
    environment:
      CLUSTER_NAME: hdfs-ha
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name
    ports:
      - "9870:9870"
    volumes:
      - hadoop_nn1:/hadoop/dfs/name
      - ./scripts/namenode-entrypoint.sh:/namenode-entrypoint.sh:ro
    command: ["/bin/bash", "/namenode-entrypoint.sh"]
    depends_on:
      - journalnode1
      - journalnode2
      - journalnode3
      - zoo1
      - zoo2
      - zoo3

  namenode2:
    <<: *hadoop-common
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode2
    hostname: namenode2
    environment:
      CLUSTER_NAME: hdfs-ha
    volumes:
      - hadoop_nn2:/hadoop/dfs/name
      - ./scripts/namenode2-entrypoint.sh:/namenode2-entrypoint.sh:ro
    command: ["/bin/bash", "/namenode2-entrypoint.sh"]
    depends_on:
      - namenode1


  datanode1:
    <<: *hadoop-common
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    hostname: datanode1
    volumes:
      - hadoop_dn1:/hadoop/dfs/data
      - ./hadoop-conf/hdfs-site.xml:/etc/hadoop/hdfs-site.xml
    depends_on:
      - namenode1
      - namenode2

  datanode2:
    <<: *hadoop-common
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    hostname: datanode2
    volumes:
      - hadoop_dn2:/hadoop/dfs/data
      - ./hadoop-conf/hdfs-site.xml:/etc/hadoop/hdfs-site.xml
    depends_on:
      - namenode1
      - namenode2

  # ---------------- Hadoop HA — YARN ----------------
  resourcemanager1:
    <<: *hadoop-common
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager1
    hostname: resourcemanager1
    environment:
      SERVICE_PRECONDITION: "namenode1:9870 namenode2:9870 datanode1:9864 datanode2:9864"
    ports:
      - "8088:8088"
    depends_on:
      - namenode1
      - namenode2
      - zoo1
      - zoo2
      - zoo3

  resourcemanager2:
    <<: *hadoop-common
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager2
    hostname: resourcemanager2
    environment:
      SERVICE_PRECONDITION: "namenode1:9870 namenode2:9870 datanode1:9864 datanode2:9864"
    ports:
      - "8089:8088"
    depends_on:
      - resourcemanager1

  nodemanager1:
    <<: *hadoop-common
    build:
      context: ./nodemanager
      dockerfile: Dockerfile
    container_name: nodemanager1
    hostname: nodemanager1
    environment:
      SERVICE_PRECONDITION: "namenode1:9870 namenode2:9870 datanode1:9864 datanode2:9864 resourcemanager1:8088 resourcemanager2:8088"
    depends_on:
      - resourcemanager1
      - resourcemanager2
      - datanode1
      - datanode2

  nodemanager2:
    <<: *hadoop-common
    build:
      context: ./nodemanager
      dockerfile: Dockerfile
    container_name: nodemanager2
    hostname: nodemanager2
    environment:
      SERVICE_PRECONDITION: "namenode1:9870 namenode2:9870 datanode1:9864 datanode2:9864 resourcemanager1:8088 resourcemanager2:8088"
    depends_on:
      - resourcemanager1
      - resourcemanager2
      - datanode1
      - datanode2

  # ---------------- Hive: metastore + HiveServer2 ----------------
  hive-metastore-db:
    image: postgres:15
    container_name: hive-metastore-db
    hostname: hive-metastore-db
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    command: ["postgres", "-c", "password_encryption=md5"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - hive_metastore_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - case-study-network

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    hostname: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HADOOP_CONF_DIR: /opt/hadoop/conf
      IS_RESUME: "true"
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    ports:
      - "9083:9083"
    volumes:
      - ./hive-conf/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./hadoop-conf:/opt/hadoop/conf:ro
      - hive_metastore_warehouse:/opt/hive/data/warehouse
    depends_on:
      hive-metastore-db:
        condition: service_healthy
      namenode1:
        condition: service_started
      namenode2:
        condition: service_started
    restart: unless-stopped
    networks:
      - case-study-network

  hive-server:
    image: apache/hive:3.1.3
    container_name: hive-server
    hostname: hive-server
    environment:
      SERVICE_NAME: hiveserver2
      HADOOP_CONF_DIR: /opt/hadoop/conf
      SKIP_SCHEMA_INIT: "true"
      DB_DRIVER: postgres
      IS_RESUME: "true"
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./hive-conf/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./hadoop-conf:/opt/hadoop/conf:ro
    depends_on:
      - hive-metastore
      - resourcemanager1
      - resourcemanager2
    restart: unless-stopped
    networks:
      - case-study-network

  # ---------------- Spark: submit-only client, runs on YARN ----------------
  spark-submit:
    image: apache/spark:3.5.3
    container_name: spark-submit
    depends_on:
      - resourcemanager1
      - resourcemanager2
      - namenode1
      - namenode2
      - hive-metastore
    env_file:
      - .env
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/conf
      YARN_CONF_DIR: /opt/hadoop/conf
    volumes:
      - ./spark-jobs:/opt/spark-jobs
      - ./hadoop-conf:/opt/hadoop/conf:ro
      - ./hive-conf/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    networks:
      - case-study-network
    entrypoint: ["tail", "-f", "/dev/null"]

networks:
  case-study-network:
    name: tidaline-case-study-network
    driver: bridge

volumes:
  kafka_kraft_data:
  postgres_data:
  airflow_postgres_data:
  hadoop_journal1:
  hadoop_journal2:
  hadoop_journal3:
  hadoop_nn1:
  hadoop_nn2:
  hadoop_dn1:
  hadoop_dn2:
  hive_metastore_db_data:
  hive_metastore_warehouse: